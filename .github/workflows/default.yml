name: default

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/qwersteve07/latin-dance
  APP_DIR: /root/social-dance

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up SSH key
        run: ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Upload docker-compose.yml
        run: |
          ssh ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} "mkdir -p ${{ env.APP_DIR }}"
          scp docker-compose.yml ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:${{ env.APP_DIR }}/docker-compose.yml

      - name: Pull and restart container
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} \
            "docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"
          ssh ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} "
            set -e
            cd ${{ env.APP_DIR }}
            export IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ${{ env.REGISTRY }}
            docker image prune -f
          "
