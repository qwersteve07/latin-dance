name: default

on:
  push:
    branches:
      - main
jobs:
  build-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up SSH key
        run: ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: build files
        run: npm install && npm run build

      - name: SSH into Server and Create Folder
        run: |
          ssh  ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} "mkdir -p /root/latin-dance/.next"

      - name: sync files
        run: rsync -avhzr .next/. ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/root/latin-dance/.next

      - name: run service
        run: ssh ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} << pm2 restart 0
